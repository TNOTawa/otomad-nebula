[project]
name = "otomad-nebula"
version = "0.1.0"
description = "音MAD星云计划：音MAD作品多模态向量数据库与可交互星云可视化"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "requests>=2.28",
  "tqdm>=4.60",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "umap-learn>=0.5.5",
  "plotly>=5.18",
  "streamlit>=1.30",
  "yt-dlp>=2024.1.1",
  "joblib>=1.3",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.6",
  "torchvision",
  "transformers>=5.0",
  "huggingface_hub>=0.34",
  "safetensors>=0.4",
  "av>=12",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["nebula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: 需要本地 ffmpeg/ffprobe 的集成测试",
  "model: 需要 PE-AV 权重与 torch 的测试",
  "network: 需要外部网络的测试",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_smoke", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["nebula"]
